name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint static checks
        run: npm run lint

      - name: Run production dependency audit (0 moderate+ vulnerabilities)
        run: npm run check:security

      - name: Run shell syntax and ShellCheck static checks
        run: |
          sh -n deploy-router.sh
          sh -n docker-entrypoint.sh
          sh -n integrations/hermes-skill/install.sh
          shellcheck -S warning deploy-router.sh docker-entrypoint.sh integrations/hermes-skill/install.sh

      - name: Run Python syntax checks
        run: |
          python3 -m py_compile integrations/hermes-skill/corefeed-news/scripts/corefeed_cli.py
          python3 -m py_compile scripts/ag-generate-tts.py

      - name: Run full Node.js test suite
        run: npm test
