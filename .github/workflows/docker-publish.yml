name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke-test local Docker build (non-root runtime, health, SSR, SKILL.md)
        run: |
          set -e
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          docker build --build-arg APP_VERSION="${EXPECTED_VERSION}" -t corefeed:ci-smoke .
          trap 'docker rm -f corefeed-ci-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name corefeed-ci-smoke -p 3120:3120 -e GITHUB_SYNC_ENABLED=false corefeed:ci-smoke

          HEALTH_JSON=""
          for _ in $(seq 1 20); do
            if HEALTH_JSON=$(curl -fsS http://127.0.0.1:3120/api/health 2>/dev/null); then
              break
            fi
            sleep 1
          done
          test -n "${HEALTH_JSON}"
          echo "Health response: ${HEALTH_JSON}"
          echo "${HEALTH_JSON}" | grep -q "\"version\":\"${EXPECTED_VERSION}\""

          # Verify non-root node process UID inside container
          NODE_UID=$(docker exec corefeed-ci-smoke sh -c 'for p in /proc/[0-9]*; do if grep -q "server.js" "$p/cmdline" 2>/dev/null; then awk "/^Uid:/ {print \$2}" "$p/status"; break; fi; done')
          echo "Running node UID: ${NODE_UID}"
          test -n "${NODE_UID}"
          test "${NODE_UID}" != "0"

          # Verify SSR root HTML serves cleanly with zero external CDN references
          HOME_HTML=$(curl -fsS http://127.0.0.1:3120/)
          echo "${HOME_HTML}" | grep -q 'type="module"'
          ! echo "${HOME_HTML}" | grep -qE 'cdn\.tailwindcss\.com|fonts\.googleapis\.com|cdnjs\.cloudflare\.com'

          # Verify Hermes Skill endpoint serves SKILL.md cleanly
          curl -fsS http://127.0.0.1:3120/api/ai/hermes-skill/SKILL.md | grep -qi 'corefeed'

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image (amd64 & arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
