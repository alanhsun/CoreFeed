name: Scheduled Global News Harvest & Chinese Snapshot Publish

on:
  schedule:
    # 每日早 07:50、中 12:20、晚 19:20 (北京时间 Asia/Shanghai) 作为兜底保障：
    # 若 07:40/12:10/19:10 的 Antigravity 客户端已完成精编推送，30 分钟冷却机制会自动跳过不覆盖；
    # 若客户端未触发，则在软路由 08:00/12:30/19:30 拉取前 10 分钟自动兜底发布。
    - cron: '50 23 * * *' # 07:50 Asia/Shanghai
    - cron: '20 4 * * *'  # 12:20 Asia/Shanghai
    - cron: '20 11 * * *' # 19:20 Asia/Shanghai
  workflow_dispatch:
    inputs:
      force:
        description: '是否忽略 30 分钟多客户端冷却窗口强制重新采编 (--force)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  harvest-compile-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      SCHEDULE_TIMEZONE: Asia/Shanghai
      GITHUB_PUSH_ENABLED: 'true'
      AG_GITHUB_SYNC: 'true'
      AG_GITHUB_BRANCH: ag-snapshot
      GITHUB_COOLDOWN_MINUTES: '30'
      CLIENT_ID: github-actions-cron
      AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Configure Git identity for ag-snapshot orphan commit
        run: |
          git config user.name "corefeed-bot"
          git config user.email "corefeed-bot@users.noreply.github.com"

      - name: Run 4-Stage Harvest, Chinese Compile & GitHub ag-snapshot Publish
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          node scripts/ag-auto-update.js --local-only --github --client-id=github-actions-cron $FORCE_FLAG
