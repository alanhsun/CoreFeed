services:
  corefeed:
    build: .
    image: corefeed:2.0
    container_name: corefeed
    restart: unless-stopped
    ports:
      - "3120:3120"
    environment:
      - NODE_ENV=production
      - PORT=3120
      - TZ=Asia/Shanghai
      - AI_BASE_URL=${AI_BASE_URL:-https://nl.alansun.host:9443/v1}
      - AI_API_KEY=${AI_API_KEY:-sk-67a4e5e2baba0b27-666i7t-0f8052ff}
      - AI_MODEL=${AI_MODEL:-ag/gemini-4-argon-high}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3120/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s