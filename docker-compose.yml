services:
  corefeed:
    build: .
    image: corefeed:2.0
    container_name: corefeed
    restart: unless-stopped
    ports:
      - "3120:3120"
    environment:
      - NODE_ENV=production
      - PORT=3120
      - TZ=Asia/Shanghai
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3120/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s